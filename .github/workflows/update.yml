name: Update regime data

# Recompute the market regime and refresh the site's JSON on a schedule.
# The committed docs/data/*.json is what GitHub Pages serves, so a push to
# docs/ automatically republishes the site.

on:
  schedule:
    # Weekdays at 22:30 UTC — after the US cash close (~20:00–21:00 UTC),
    # so the latest daily bar is available. Cron is always UTC.
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-regime
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the OHLCV parquet cache across runs so daily fetches are
      # incremental and resilient to transient yfinance failures.
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data/ohlcv_cache
          key: ohlcv-cache-${{ github.run_id }}
          restore-keys: |
            ohlcv-cache-

      - name: Compute regime + write JSON
        run: python regime_pipeline.py --history-years 5

      - name: Commit refreshed data
        run: |
          git config user.name "regime-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json docs/data/history.json
          if git diff --cached --quiet; then
            echo "No regime changes today."
          else
            git commit -m "chore: daily regime update ($(date -u +%Y-%m-%d))"
            git push
          fi
